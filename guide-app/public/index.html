<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="StreamVault TV Guide" />
    <title>StreamVault TV</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; background: #0a0a0a; color: #ffffff; }
      :focus { outline: 3px solid #0056A8; outline-offset: 2px; }
      :focus:not(:focus-visible) { outline: none; }
      :focus-visible { outline: 3px solid #0056A8; outline-offset: 2px; }
    </style>
  </head>

    <div id="root"></div>
  </body>
