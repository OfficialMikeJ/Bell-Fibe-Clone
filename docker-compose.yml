# ─── StreamVault TV — Production Docker Compose ────────────────────────────────
#
# Quick Start:
#   1. cp .env.example .env  and fill in every value
#   2. docker compose up -d
#
# Point your existing Nginx Proxy Manager to:
#   api.yourdomain.com    →  http://YOUR_SERVER_IP:8001   (Backend API)
#   admin.yourdomain.com  →  http://YOUR_SERVER_IP:3000   (Admin Dashboard)
#   yourdomain.com        →  http://YOUR_SERVER_IP:3001   (Customer TV Guide)
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB 7.0 ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: streamvault_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamvault_backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/${DB_NAME}?authSource=admin
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_NAME: ${SERVICE_NAME:-StreamVault TV}
      ACTIVATION_DOMAIN: ${ACTIVATION_DOMAIN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - uploads:/app/backend/uploads
    ports:
      - "8001:8001"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Admin Dashboard (React + Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    container_name: streamvault_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy


# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  uploads:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true    # MongoDB is not reachable from outside
  proxy:
    driver: bridge    # All web-facing services share this network
